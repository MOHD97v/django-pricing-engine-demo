name: Django CI and Demo Artifact

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    name: Test Django and package demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Django system checks
        run: python manage.py check

      - name: Run Django test suite
        run: python manage.py test apps.demo -v 2

      - name: Package runnable demo
        run: |
          mkdir -p dist
          zip -q -r dist/commerce-pricing-demo.zip apps config docs screenshots manage.py requirements.txt README.md \
            -x '*/__pycache__/*' '*.pyc'

      - name: Upload tested demo artifact (3 days)
        uses: actions/upload-artifact@v4
        with:
          name: commerce-pricing-demo
          path: dist/commerce-pricing-demo.zip
          if-no-files-found: error
          retention-days: 3
